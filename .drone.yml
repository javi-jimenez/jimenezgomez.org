kind: pipeline
type: docker
name: build-deploy

# El pipeline llama SIEMPRE a objetivos de Make (fuente de verdad).
# Cada step corre en una imagen oficial que aporta la herramienta;
# `make` detecta la herramienta en el entorno y la usa directamente.

steps:
  - name: build
    image: ghcr.io/gohugoio/hugo:latest
    commands:
      # La imagen oficial de Hugo es Alpine mínima sin `make`; lo instalamos
      # en este step (no afecta al host). Luego todo pasa por Make.
      - apk add --no-cache make
      - make dep
      - make build

  - name: deploy
    image: alpine:3.18
    environment:
      FTP_SERVER:
        from_secret: FTP_SERVER
      FTP_USERNAME:
        from_secret: FTP_USERNAME
      FTP_PASSWORD:
        from_secret: FTP_PASSWORD
    commands:
      - apk add --no-cache make lftp
      - make ftp-deploy

trigger:
  branch:
    - main
  event:
    - push
