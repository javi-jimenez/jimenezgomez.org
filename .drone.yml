version: 1.1

name: jimenezgomez.org/hugo-site

on: push

env:
  DOCKER: "jimenezgomez-org/jimenezgomez-frontend:latest"
  
E_NAME: "https://jenkins.gitlab-ci.com/c/job/$(CI_COMMIT_BRANCH)/ref/$CI_COMMIT_REF_SLUG/distro/ghcr.io/"
  
deploy:
  - job: "build"
    step: "deploy"
    
    stage: deploy
    
    environment:
      name: $CI_NAME
        
deploy:
  image: jimenezgomez-org/hugo-site

jobs:
  build:
    stage: build
    script: |
      # Hugo Static Site Build Configuration for FTP Upload
      echo "Starting Hugo static site build..."
      
      cd /home/user/data/repo/jimenezgomez.org/
      
      # Deploy to OVH FTP at /jimenezgomez.org/
      ftp -n -m 2010: jimenezgomez-frontend@hugo.sites.ovh
        << EOF
        c get public/index.html index.html
        c put public/posts/YYYY-MM-DD-slug/*.html public/$(basename $file).html
        
      # Verify successful upload
      echo "Upload complete"
    fail_on_failure: false
    
  deploy:
    stage: deploy
    script: |
      cd /home/user/data/repo/jimenezgomez.org/
      
      # Upload to OVH FTP at /jimenezgomez.org/
      ftp -n -m 2010: jimenezgomez-frontend@hugo.sites.ovh
        << EOF
          c get public/index.html index.html
          c put public/posts/YYYY-MM-DD-slug/*.html public/$(basename $file).html

    on: push

