<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">El Caminante: todos juegan, uno camina</title>
  <desc id="dsc">Un tablero de ajedrez lleno de piezas que se disputan el centro. Uno de los jugadores ha salido del tablero y camina en línea recta hacia la luz, abandonando las conexiones que lo ataban. El camino es la parte intangible: la fe. Las acciones sobre el camino son la parte tangible: el Verbo hecho Acción.</desc>

  <defs>
    <!-- Fondo nocturno -->
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="55%" stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Luz: el destino. Intangible, no se puede medir. -->
    <radialGradient id="holiness" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%"  stop-color="#fff6d8" stop-opacity="0.92"/>
      <stop offset="48%"  stop-color="#e2b552" stop-opacity="0.55"/>
      <stop offset="76%"  stop-color="#c98f2e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c98f2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo del caminante -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dff0ff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#54d7ea" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#54d7ea" stop-opacity="0"/>
    </radialGradient>

    <!-- Tablero: el juego que se disputan los demás -->
    <linearGradient id="boardTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1d2a3d"/>
      <stop offset="100%" stop-color="#0f1826"/>
    </linearGradient>

    <linearGradient id="pathGlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#54d7ea" stop-opacity="0.05"/>
      <stop offset="55%"  stop-color="#9fe8f4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- Retícula cartesiana sutil: formalismo, el juego tiene reglas -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#2a3b52" stroke-width="0.7" stroke-opacity="0.30"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#night)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- ══════════════ LA LUZ (destino) ══════════════ -->
  <circle cx="1370" cy="270" r="380" fill="url(#holiness)" opacity="0.50" filter="url(#soft)"/>
  <circle cx="1370" cy="270" r="185" fill="url(#holiness)" opacity="0.80" filter="url(#soft)"/>
  <circle cx="1370" cy="270" r="88" fill="#fffdf5" fill-opacity="0.30" filter="url(#soft2)"/>

  <!-- Cruz de luz: delgada, geométrica, no confesional -->
  <g opacity="0.95" filter="url(#soft2)">
    <rect x="1368" y="150" width="5" height="240" fill="#fff9e6"/>
    <rect x="1298" y="216" width="145" height="5" fill="#fff9e6"/>
  </g>
  <g opacity="0.75">
    <rect x="1369" y="150" width="3" height="240" fill="#ffffff"/>
    <rect x="1298" y="217" width="145" height="3" fill="#ffffff"/>
  </g>

  <!-- Rayos sutiles -->
  <g opacity="0.26" stroke="#fff6d8" stroke-width="1.4" stroke-linecap="round">
    <line x1="1370" y1="270" x2="1160" y2="40"/>
    <line x1="1370" y1="270" x2="1580" y2="70"/>
    <line x1="1370" y1="270" x2="1090" y2="340"/>
    <line x1="1370" y1="270" x2="1590" y2="450"/>
    <line x1="1370" y1="270" x2="1240" y2="490"/>
  </g>

  <!-- ══════════════ EL TABLERO (el juego de los demás) ══════════════ -->
  <!-- Plataforma en perspectiva isométrica ligera -->
  <g transform="translate(120,470)">
    <polygon points="0,150 470,60 900,150 430,255" fill="url(#boardTop)" stroke="#3a4f6b" stroke-width="2" stroke-opacity="0.75"/>

    <!-- Casillas -->
    <g stroke="#3d5470" stroke-width="1" stroke-opacity="0.45">
      <!-- fila 1 -->
      <polygon points="0,150 118,124 236,150 118,177" fill="#16233a"/>
      <polygon points="118,124 236,99 353,124 236,150" fill="#1c2c45"/>
      <polygon points="236,99 353,74 470,99 353,124" fill="#16233a"/>
      <polygon points="353,74 470,60 588,88 470,99" fill="#1c2c45"/>
      <polygon points="470,60 588,88 706,113 588,100" fill="#16233a"/>
      <polygon points="588,88 706,113 824,138 706,116" fill="#1c2c45"/>
      <polygon points="706,113 824,138 900,152 824,140" fill="#16233a"/>
      <!-- fila 2 -->
      <polygon points="118,177 236,150 353,176 236,203" fill="#1c2c45"/>
      <polygon points="236,150 353,124 470,150 353,176" fill="#16233a"/>
      <polygon points="353,124 470,99 588,126 470,150" fill="#1c2c45"/>
      <polygon points="470,99 588,126 706,152 588,128" fill="#16233a"/>
      <polygon points="588,126 706,152 824,178 706,154" fill="#1c2c45"/>
      <polygon points="706,152 824,178 900,190 824,180" fill="#16233a"/>
      <!-- fila 3 -->
      <polygon points="236,203 353,176 470,202 353,230" fill="#16233a"/>
      <polygon points="353,176 470,150 588,178 470,202" fill="#1c2c45"/>
      <polygon points="470,150 588,178 706,204 588,180" fill="#16233a"/>
      <polygon points="588,178 706,204 824,230 706,206" fill="#1c2c45"/>
      <polygon points="706,204 824,230 900,242 824,232" fill="#16233a"/>
    </g>

    <!-- Piezas: blancas y negras mezcladas, disputándose el centro -->
    <g>
      <!-- bloque blanco -->
      <circle cx="330" cy="150" r="15" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.6"/>
      <circle cx="430" cy="176" r="15" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.6"/>
      <circle cx="540" cy="200" r="15" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.6"/>
      <!-- bloque negro -->
      <circle cx="620" cy="170" r="15" fill="#0e141d" stroke="#546b88" stroke-width="1.6"/>
      <circle cx="720" cy="192" r="15" fill="#0e141d" stroke="#546b88" stroke-width="1.6"/>
      <circle cx="810" cy="212" r="15" fill="#0e141d" stroke="#546b88" stroke-width="1.6"/>
      <!-- centro en disputa: dos piezas juntas, tensas -->
      <circle cx="470" cy="152" r="17" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.8"/>
      <circle cx="500" cy="162" r="17" fill="#0e141d" stroke="#546b88" stroke-width="1.8"/>
      <!-- una torre -->
      <rect x="390" y="212" width="26" height="20" rx="2" fill="#0e141d" stroke="#546b88" stroke-width="1.6"/>
      <rect x="393" y="206" width="20" height="8" fill="#0e141d" stroke="#546b88" stroke-width="1.4"/>
      <!-- un alfil -->
      <path d="M 700 105 q 16 22 0 44 q -16 -22 0 -44 z" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.6"/>
      <rect x="692" y="148" width="16" height="7" rx="2" fill="#e8eef7" stroke="#8fa8c4" stroke-width="1.4"/>
    </g>

    <!-- El hueco: la casilla que el caminante dejó vacía (borde derecho = salida) -->
    <polygon points="706,152 824,178 900,190 824,180" fill="#000000" fill-opacity="0.62"/>
    <polygon points="706,152 824,178 900,190 824,180" fill="none" stroke="#54d7ea" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="7 6"/>
    <text x="806" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#54d7ea" letter-spacing="1.5">VACÍO</text>

    <!-- Etiqueta del tablero -->
    <text x="450" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6f88a6" letter-spacing="3">EL JUEGO · SUMA CERO</text>
  </g>

  <!-- ══════════════ EL CAMINO (la parte intangible: la fe) ══════════════ -->
  <!-- Sale del hueco vacío (borde derecho del tablero) hacia la luz -->
  <g filter="url(#soft2)" opacity="0.55">
    <path d="M 1000 652 L 1360 292" stroke="#54d7ea" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M 1000 652 L 1360 292" stroke="url(#pathGlow)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Puntos de luz sobre el camino: los pasos / las acciones tangibles -->
  <g fill="#dff0ff">
    <circle cx="1050" cy="605" r="3.4" opacity="0.55"/>
    <circle cx="1100" cy="555" r="3.8" opacity="0.65"/>
    <circle cx="1150" cy="505" r="4.2" opacity="0.75"/>
    <circle cx="1200" cy="455" r="4.6" opacity="0.85"/>
    <circle cx="1250" cy="405" r="5.0" opacity="0.92"/>
    <circle cx="1300" cy="355" r="5.4" opacity="0.97"/>
    <circle cx="1345" cy="308" r="5.8" opacity="1"/>
  </g>

  <!-- Etiqueta del camino -->
  <text x="880" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9fe8f4" letter-spacing="3">EL CAMINO · LA FE</text>
  <text x="880" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#6f88a6" letter-spacing="1.5">intangible · invariante en la partida</text>

  <!-- ══════════════ EL CAMINANTE ══════════════ -->
  <!-- De espaldas, avanzando hacia la luz. Silueta humana, no un diagrama. -->
  <g transform="translate(1150,520)">
    <!-- halo cálido: lo divino, no lo tecnológico -->
    <circle cx="0" cy="-8" r="160" fill="url(#aura)" filter="url(#soft)"/>
    <circle cx="0" cy="-30" r="52" fill="#fff6d8" fill-opacity="0.18" filter="url(#soft2)"/>

    <g fill="#0d1622" stroke="#d9eef7" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <!-- cabeza: ovalada, humana -->
      <ellipse cx="0" cy="-56" rx="11.5" ry="13.5"/>
      <!-- cuello -->
      <path d="M -5 -44 L 5 -44 L 6 -37 L -6 -37 Z"/>
      <!-- tronco: hombros anchos, cintura estrecha -->
      <path d="M -17 -35 Q -19 -18 -14 2 L 14 2 Q 19 -18 17 -35 Z"/>
      <!-- brazo izquierdo, relajado -->
      <path d="M -16 -32 Q -26 -16 -24 2" fill="none" stroke-width="6.5"/>
      <!-- brazo derecho, señalando el camino -->
      <path d="M 16 -32 Q 30 -26 40 -16" fill="none" stroke-width="6.5"/>
      <!-- pierna adelantada, con paso -->
      <path d="M 5 2 Q 12 24 16 44" fill="none" stroke-width="7"/>
      <path d="M 16 44 L 25 47" fill="none" stroke-width="5"/>
      <!-- pierna atrás -->
      <path d="M -6 2 Q -12 22 -16 40" fill="none" stroke-width="7"/>
      <path d="M -16 40 L -24 44" fill="none" stroke-width="5"/>
    </g>

    <!-- estela: las conexiones que dejó atrás, rotas -->
    <g stroke="#54d7ea" stroke-width="1.4" stroke-opacity="0.38" fill="none">
      <path d="M -22 -18 q -34 4 -62 -4"/>
      <path d="M -24 0 q -38 -4 -68 -16"/>
      <path d="M -20 -42 q -28 -16 -46 -34"/>
    </g>
    <g fill="#54d7ea" fill-opacity="0.45">
      <circle cx="-88" cy="-24" r="2.6"/>
      <circle cx="-96" cy="-18" r="2.6"/>
      <circle cx="-68" cy="-78" r="2.6"/>
    </g>
  </g>

  <!-- ══════════════ EL VERBO HECHO ACCIÓN (parte tangible) ══════════════ -->
  <!-- Diagrama de Argand: parte real = acción, parte imaginaria = fe -->
  <g transform="translate(140,830)">
    <!-- ejes -->
    <line x1="0" y1="0" x2="230" y2="0" stroke="#3d5470" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#3d5470" stroke-width="1.5"/>
    <polygon points="230,0 222,-4 222,4" fill="#3d5470"/>
    <polygon points="0,-140 -4,-132 4,-132" fill="#3d5470"/>

    <!-- vector z = a + bi -->
    <line x1="0" y1="0" x2="150" y2="-92" stroke="#e2b552" stroke-width="2.6"/>
    <line x1="150" y1="0" x2="150" y2="-92" stroke="#e2b552" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
    <line x1="0" y1="-92" x2="150" y2="-92" stroke="#e2b552" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
    <circle cx="150" cy="-92" r="5" fill="#e2b552"/>

    <!-- etiquetas -->
    <text x="118" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2b552" opacity="0.95">Re: ACCIÓN</text>
    <text x="6" y="-122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2b552" opacity="0.95">Im: FE</text>
    <text x="158" y="-98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fff6d8">z</text>
  </g>

  <text x="140" y="972" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2b552" letter-spacing="2">EL VERBO HECHO ACCIÓN</text>
  <text x="140" y="990" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#6f88a6" letter-spacing="1">lo tangible se mide · lo demás también cuenta</text>

  <!-- Contador del juego: los demás siguen jugando -->
  <text x="1240" y="940" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6f88a6" letter-spacing="2">ELLOS SIGUEN JUGANDO</text>
  <text x="1240" y="962" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4a6076" letter-spacing="1.5">suma cero · nadie gana · nadie sale</text>
</svg>
