<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#071023" />
      <stop offset="100%" stop-color="#0b2540" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#43E97B" />
      <stop offset="100%" stop-color="#38A3E6" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="1200" height="630" fill="url(#g1)" />

  <!-- Fondo de código: líneas monoespaciadas en baja opacidad -->
  <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="16" fill="#ffffff" opacity="0.06">
    <text x="48" y="80">// function handle(input) { return transform(input); }</text>
    <text x="48" y="110">const data = fetch('/api/knowledge');</text>
    <text x="48" y="140">for (let i = 0; i &lt; data.length; i++) { /* process */ }</text>
    <text x="48" y="170">if (license.permits) apply(openSource); else protect(cognition);</text>
    <text x="48" y="200">/* TODO: trazabilidad de intención, orquestación semántica */</text>
    <text x="48" y="230">class Memory { constructor() { this.facts = []; } }</text>
    <text x="48" y="260">// --</text>
    <text x="48" y="290">/* stack: author -> idea -> commons -> corporate */</text>
  </g>

  <!-- Oscurecer y desenfocar ligeramente el fondo de código -->
  <rect x="0" y="0" width="1200" height="630" fill="#000" opacity="0.18" />

  <!-- Título y subtítulo -->
  <g fill="#fff" font-family="Inter, Arial, sans-serif">
    <text x="64" y="160" font-size="44" font-weight="700">El Espejismo del Open Source</text>
    <text x="64" y="210" font-size="20" opacity="0.9">¿Libertad o Despojo Programado?</text>
  </g>

  <!-- Elementos que representan cognición / inteligencia: red neuronal estilizada -->
  <g transform="translate(780,120)">
    <!-- conexiones -->
    <line x1="-20" y1="20" x2="40" y2="8" stroke="url(#accent)" stroke-width="2" opacity="0.9"/>
    <line x1="-10" y1="60" x2="60" y2="40" stroke="url(#accent)" stroke-width="2" opacity="0.85"/>
    <line x1="30" y1="-10" x2="30" y2="80" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

    <!-- nodos -->
    <circle cx="-20" cy="20" r="12" fill="#071023" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="40" cy="8" r="14" fill="#071023" stroke="#7EE7C9" stroke-width="3"/>
    <circle cx="-10" cy="60" r="10" fill="#071023" stroke="#7EC2F0" stroke-width="3"/>
    <circle cx="60" cy="40" r="9" fill="#071023" stroke="#43E97B" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="16" fill="#0b2540" stroke="#38A3E6" stroke-width="4"/>

    <!-- trazos tipo circuito para dar sensación de sistema -->
    <path d="M92 10 C110 20, 120 40, 94 68" stroke="#2ec5ff" stroke-opacity="0.18" stroke-width="6" fill="none" />
    <path d="M-40 90 C-10 120, 40 110, 90 92" stroke="#43E97B" stroke-opacity="0.12" stroke-width="6" fill="none" />
  </g>

  <!-- Icono estilizado de 'cognición' (forma de cerebro simplificada con nodos) -->
  <g transform="translate(720,320) scale(1.6)">
    <path d="M70 10 C110 10, 130 40, 120 70 C140 95, 110 140, 70 130 C50 150, 10 140, 10 110 C-20 100, -10 70, 10 60 C0 40, 30 10, 70 10 Z"
          fill="#081827" stroke="#4fd1c5" stroke-width="2" opacity="0.95"/>
    <circle cx="38" cy="58" r="3.5" fill="#9ef1cf" />
    <circle cx="60" cy="42" r="3.5" fill="#9ad0ff" />
    <circle cx="48" cy="86" r="3.5" fill="#b8f0d8" />
    <line x1="38" y1="58" x2="48" y2="86" stroke="#76d3ff" stroke-width="1.2" opacity="0.8"/>
    <line x1="60" y1="42" x2="48" y2="86" stroke="#5ee1a6" stroke-width="1.2" opacity="0.85"/>
  </g>

  <!-- Pie de imagen / marca ligera -->
  <g transform="translate(64,560)" font-family="Inter, Arial, sans-serif" font-size="12" fill="#cfeef5" opacity="0.6">
    <text>Artículo: El Espejismo del Open Source — jimenezgomez.org</text>
  </g>

</svg>
