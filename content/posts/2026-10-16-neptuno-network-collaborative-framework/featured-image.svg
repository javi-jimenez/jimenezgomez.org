<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#071023" />
      <stop offset="100%" stop-color="#0b2540" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#54d7ea" />
      <stop offset="100%" stop-color="#e2b552" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54d7ea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#54d7ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Rejilla tenue -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Malla de nodos (Neptuno Network) -->
  <g transform="translate(830,150)">
    <circle cx="150" cy="150" r="230" fill="url(#glow)" />

    <!-- Enlaces -->
    <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2" fill="none">
      <line x1="150" y1="150" x2="30" y2="40" />
      <line x1="150" y1="150" x2="120" y2="15" />
      <line x1="150" y1="150" x2="250" y2="30" />
      <line x1="150" y1="150" x2="295" y2="140" />
      <line x1="150" y1="150" x2="255" y2="262" />
      <line x1="150" y1="150" x2="105" y2="295" />
      <line x1="150" y1="150" x2="18" y2="200" />
      <line x1="30" y1="40" x2="120" y2="15" />
      <line x1="250" y1="30" x2="295" y2="140" />
      <line x1="255" y1="262" x2="105" y2="295" />
      <line x1="18" y1="200" x2="105" y2="295" stroke-opacity="0.3" />
    </g>

    <!-- Nodos periféricos (nodos humanos / edge) -->
    <g fill="#071023" stroke="#54d7ea" stroke-width="3">
      <circle cx="30" cy="40" r="11" />
      <circle cx="120" cy="15" r="9" />
      <circle cx="250" cy="30" r="10" />
      <circle cx="295" cy="140" r="12" />
      <circle cx="255" cy="262" r="9" />
      <circle cx="105" cy="295" r="11" />
      <circle cx="18" cy="200" r="9" />
    </g>

    <!-- Nodo central (agente LAIA) -->
    <circle cx="150" cy="150" r="38" fill="#081827" stroke="url(#accent)" stroke-width="4" />
    <path d="M150 92 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"
          fill="#e2b552" fill-opacity="0.9" />
  </g>

  <!-- Marco de texto -->
  <g fill="#ffffff" font-family="Inter, Arial, sans-serif">
    <text x="64" y="150" font-size="46" font-weight="700">The Neptuno Network</text>
    <text x="64" y="196" font-size="21" opacity="0.92">A Collaborative Operational Framework</text>
    <text x="64" y="226" font-size="21" opacity="0.92">for Human-AI Teams</text>
    <line x1="64" y1="262" x2="196" y2="262" stroke="url(#accent)" stroke-width="4" />
    <text x="64" y="306" font-size="16" opacity="0.72">BRISECOM SL · Neptuno Network · Framework LAIA</text>
  </g>

  <!-- Etiquetas de los tres pilares -->
  <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="14" fill="#cfeef5" opacity="0.75">
    <text x="64" y="392">[ human workers ]</text>
    <text x="64" y="418">[ encrypted fabric ]</text>
    <text x="64" y="444">[ agentic reasoning ]</text>
    <text x="64" y="470">[ three-layer protection ]</text>
  </g>

  <!-- Pie -->
  <g transform="translate(64,570)" font-family="Inter, Arial, sans-serif" font-size="12" fill="#cfeef5" opacity="0.6">
    <text>Articulo: The Neptuno Network — jimenezgomez.org</text>
  </g>
</svg>
