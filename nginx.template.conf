# Plantilla de server para nginx:alpine.
# Se procesa a /etc/nginx/conf.d/default.conf (dentro del bloque http del
# nginx.conf principal), así que SOLO contiene el bloque server.
# El puerto se configura con la env var PORT (default 80).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache para assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas limpias: servir index.html para rutas sin extensión
    location / {
        try_files $uri $uri/ =404;
    }
}
