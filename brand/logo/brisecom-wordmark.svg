<?xml version="1.0" encoding="UTF-8"?>
<!-- Brisecom wordmark: clean sans wordmark with accent color -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Brisecom wordmark">
  <rect width="100%" height="100%" fill="none"/>
  <g fill="#00A8C6" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="72">
    <text x="20" y="130" fill="#00A8C6">brise</text>
    <text x="270" y="130" fill="#006D9C">com</text>
  </g>
  <!-- small wave underline -->
  <path d="M18 150 C 80 170, 160 120, 250 150 S 420 170, 500 150" stroke="#00C2E0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
</svg>
