# Workflow de Gitea Actions para jimenezgomez.org
#
# Compila el sitio con Hugo (Makefile = fuente de verdad) y lo despliega
# por FTP/FTPS al hosting de OVH.
#
# Secretos requeridos (Settings > Actions > Secrets del repo en Gitea):
#   FTP_SERVER    - host FTP/FTPS
#   FTP_USERNAME  - usuario FTP
#   FTP_PASSWORD  - contraseña FTP
# Opcional:
#   FTP_REMOTE_PATH - ruta remota (por defecto /jimenezgomez.org/)
name: build

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Build site (make build)
        run: make build

      - name: Deploy to OVH FTP (make ftp-deploy)
        # Solo si los secretos están definidos (permite testear el build sin deploy).
        if: ${{ secrets.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: make ftp-deploy

      - name: Upload public artifact (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          if-no-files-found: warn
