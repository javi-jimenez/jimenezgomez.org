<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Contract-first, interface-agnostic design</title>
  <desc id="desc">A software architecture diagram showing encrypted files flowing through a stable core into CLI, API, GUI, and browser adapters.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 530 C260 450 430 600 700 500 S1020 420 1200 490 V630 H0Z" fill="#0b2f3a" opacity="0.65"/>
  <g font-family="Georgia, serif" fill="#f8fafc">
    <text x="76" y="92" font-size="22" letter-spacing="3" fill="#fbbf24">SOFTWARE ARCHITECTURE</text>
    <text x="76" y="158" font-size="48" font-weight="700">From Unix Commands</text>
    <text x="76" y="213" font-size="48" font-weight="700">to APIs</text>
    <text x="78" y="260" font-size="24" fill="#cbd5e1">Design around contracts, not interfaces.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="76" y="345" width="190" height="104" rx="12" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="171" y="388" text-anchor="middle" font-family="monospace" font-size="19" fill="#67e8f9">DATA</text>
    <text x="171" y="419" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f8fafc">encrypted files</text>
    <rect x="430" y="315" width="300" height="164" rx="18" fill="url(#core)"/>
    <text x="580" y="370" text-anchor="middle" font-family="monospace" font-size="20" fill="#fff7ed">CORE CONTRACT</text>
    <text x="580" y="411" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#fff7ed">operations</text>
    <text x="580" y="446" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffedd5">input -> result / error</text>
    <rect x="894" y="294" width="230" height="205" rx="14" fill="#0f172a" stroke="#a7f3d0" stroke-width="2"/>
    <text x="1010" y="335" text-anchor="middle" font-family="monospace" font-size="18" fill="#a7f3d0">ADAPTERS</text>
    <text x="1010" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f8fafc">CLI  |  API</text>
    <text x="1010" y="413" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f8fafc">GUI  |  Browser</text>
    <text x="1010" y="459" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#cbd5e1">replaceable interfaces</text>
  </g>
  <g stroke="#bae6fd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M278 397 H408"/>
    <path d="M398 386 L414 397 L398 408"/>
    <path d="M748 397 H872"/>
    <path d="M862 386 L878 397 L862 408"/>
  </g>
  <text x="76" y="570" font-family="monospace" font-size="18" fill="#bae6fd">one operation, many ways to talk</text>
</svg>
