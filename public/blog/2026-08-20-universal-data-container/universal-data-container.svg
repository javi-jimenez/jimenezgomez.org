<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#1e293b"/>

  <!-- Database Icon -->
  <ellipse cx="150" cy="160" rx="60" ry="25" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <rect x="90" y="100" width="120" height="60" rx="10" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <ellipse cx="150" cy="100" rx="60" ry="25" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
  <text x="150" y="115" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">SQL</text>

  <!-- JSON Badge -->
  <rect x="260" y="110" width="180" height="60" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <text x="350" y="148" fill="#fbbf24" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">JSON</text>
  <circle cx="280" cy="140" r="8" fill="#fbbf24"/>
  <circle cx="420" cy="140" r="8" fill="#fbbf24"/>

  <!-- Arrow -->
  <line x1="210" y1="130" x2="250" y2="130" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8fafc"/>
    </marker>
  </defs>

  <!-- Container Concept -->
  <rect x="180" y="210" width="440" height="150" rx="15" fill="#2d3748" stroke="#a0aec0" stroke-width="2"/>
  <text x="400" y="245" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">SQL as Universal Container</text>
  <text x="400" y="280" fill="#cbd5e1" font-family="monospace" font-size="16" text-anchor="middle">Structured Tables for Integrity</text>
  <text x="400" y="310" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">+ JSON for Flexible, Semi-Structured Data</text>
  <text x="400" y="345" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">The best of both worlds</text>

  <!-- Small Decorative Icons -->
  <rect x="635" y="110" width="120" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="695" y="142" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">ETL</text>

  <rect x="635" y="250" width="120" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="695" y="280" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">NoSQL</text>

  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle">SQL + JSON</text>
  <text x="400" y="70" fill="#94a3b8" font-family="sans-serif" font-size="18" text-anchor="middle">The Universal Data Container</text>
</svg>