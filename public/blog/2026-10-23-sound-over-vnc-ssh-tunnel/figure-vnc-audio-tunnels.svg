<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02101c" />
      <stop offset="100%" stop-color="#07304a" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2b552" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2b552" />
    </marker>
  </defs>

  <rect width="1200" height="740" fill="url(#bg)" />

  <!-- faint cartesian grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="390" x2="1200" y2="390" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="650" x2="1200" y2="650" />
    <line x1="150" y1="0" x2="150" y2="740" />
    <line x1="300" y1="0" x2="300" y2="740" />
    <line x1="450" y1="0" x2="450" y2="740" />
    <line x1="600" y1="0" x2="600" y2="740" />
    <line x1="750" y1="0" x2="750" y2="740" />
    <line x1="900" y1="0" x2="900" y2="740" />
    <line x1="1050" y1="0" x2="1050" y2="740" />
  </g>

  <!-- header -->
  <text x="48" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="2.6" fill="#5eead4" font-weight="600">SOUND OVER VNC &#183; JIMENEZGOMEZ.ORG</text>
  <text x="48" y="86" font-family="Inter, DejaVu Sans, sans-serif" font-size="27"
        fill="#ffffff" font-weight="700">One SSH connection, two channels</text>
  <text x="48" y="112" font-family="Inter, DejaVu Sans, sans-serif" font-size="14"
        fill="#9fb8c8">-L forwards the screen; -R forwards the audio back.</text>

  <!-- ======================= LOCAL ======================= -->
  <rect x="48" y="150" width="400" height="408" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.14" />
  <text x="72" y="182" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        letter-spacing="2.4" fill="#5eead4" font-weight="700">LOCAL MACHINE</text>
  <text x="72" y="204" font-family="Inter, DejaVu Sans, sans-serif" font-size="15"
        fill="#e8fbff" font-weight="600">where you are sitting</text>

  <!-- VNC viewer card -->
  <rect x="72" y="224" width="352" height="62" rx="7"
        fill="#e2b552" fill-opacity="0.07" stroke="#e2b552" stroke-opacity="0.45" />
  <text x="90" y="248" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.6" fill="#f3e0b6" font-weight="700">VNC VIEWER</text>
  <text x="90" y="270" font-family="IBM Plex Mono, monospace" font-size="13"
        fill="#e8fbff">vncviewer localhost:5900</text>

  <!-- PulseAudio card -->
  <rect x="72" y="300" width="352" height="118" rx="7"
        fill="#5eead4" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.42" />
  <text x="90" y="324" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.6" fill="#b8f5ea" font-weight="700">PULSEAUDIO</text>
  <text x="90" y="346" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#e8fbff">load-module</text>
  <text x="90" y="364" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#e8fbff">  module-native-protocol-tcp</text>
  <text x="90" y="382" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#5eead4">  listen=127.0.0.1</text>
  <text x="90" y="400" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#5eead4">  auth-anonymous=1</text>

  <!-- speakers: where the audio actually lands -->
  <g transform="translate(96,462)">
    <path d="M0 8 L26 8 L52 -14 L52 58 L26 36 L0 36 Z"
          fill="none" stroke="#e2b552" stroke-width="2" stroke-linejoin="round" />
    <path d="M68 6 A 26 26 0 0 1 68 46" fill="none" stroke="#e2b552"
          stroke-width="2" stroke-linecap="round" />
    <path d="M82 -4 A 40 40 0 0 1 82 56" fill="none" stroke="#e2b552"
          stroke-width="2" stroke-linecap="round" stroke-opacity="0.55" />
  </g>
  <text x="202" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.8" fill="#e2b552" font-weight="600">SPEAKERS</text>
  <text x="202" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        fill="#9fb8c8">the tunnel ends where you are sitting</text>

  <!-- ======================= REMOTE ======================= -->
  <rect x="752" y="150" width="400" height="408" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.14" />
  <text x="776" y="182" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        letter-spacing="2.4" fill="#5eead4" font-weight="700">REMOTE HOST</text>
  <text x="776" y="204" font-family="Inter, DejaVu Sans, sans-serif" font-size="15"
        fill="#e8fbff" font-weight="600">X11 session, no one listening</text>

  <!-- x11vnc card -->
  <rect x="776" y="224" width="352" height="62" rx="7"
        fill="#e2b552" fill-opacity="0.07" stroke="#e2b552" stroke-opacity="0.45" />
  <text x="794" y="248" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.6" fill="#f3e0b6" font-weight="700">X11VNC</text>
  <text x="794" y="270" font-family="IBM Plex Mono, monospace" font-size="13"
        fill="#e8fbff">-localhost :5900 &#8592; X display :0</text>

  <!-- tunnel sink card -->
  <rect x="776" y="300" width="352" height="118" rx="7"
        fill="#5eead4" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.42" />
  <text x="794" y="324" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.6" fill="#b8f5ea" font-weight="700">MODULE-TUNNEL-SINK</text>
  <text x="794" y="346" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#e8fbff">  server=tcp:127.0.0.1:4713</text>
  <text x="794" y="364" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#e8fbff">  sink_name=remote_audio</text>
  <text x="794" y="382" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#5eead4">pactl set-default-sink</text>
  <text x="794" y="400" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        fill="#9fb8c8">a sink nobody selects is a sink that stays silent</text>

  <!-- application -> sink -->
  <text x="776" y="452" font-family="Inter, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="1.6" fill="#9fb8c8" font-weight="600">APPLICATIONS</text>
  <line x1="880" y1="448" x2="960" y2="424" stroke="#e2b552" stroke-opacity="0.7"
        stroke-width="1.6" marker-end="url(#arrowGold)" />
  <text x="776" y="478" font-family="IBM Plex Mono, monospace" font-size="12"
        fill="#e8fbff">aplay, ffplay, firefox &#8230;</text>

  <!-- ======================= TUNNELS ======================= -->
  <!-- the SSH trunk (drawn under the arrows) -->
  <rect x="470" y="196" width="262" height="232" rx="10"
        fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.18"
        stroke-dasharray="7 7" />
  <text x="601" y="188" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        letter-spacing="2.6" fill="#9fb8c8" font-weight="700"
        text-anchor="middle">ONE SSH CONNECTION</text>

  <!-- VNC arrow: screen comes back -->
  <text x="601" y="238" font-family="Inter, DejaVu Sans, sans-serif" font-size="13"
        fill="#f3e0b6" font-weight="700" text-anchor="middle">screen &#183; port 5900</text>
  <line x1="716" y1="252" x2="486" y2="252" stroke="#e2b552" stroke-width="2.4"
        marker-end="url(#arrowGold)" />
  <text x="601" y="276" font-family="IBM Plex Mono, monospace" font-size="11"
        fill="#e2b552" fill-opacity="0.9" text-anchor="middle">ssh -L 5900:localhost:5900</text>

  <!-- audio arrow: sound comes back through the reverse forward -->
  <text x="601" y="354" font-family="Inter, DejaVu Sans, sans-serif" font-size="13"
        fill="#b8f5ea" font-weight="700" text-anchor="middle">audio &#183; port 4713</text>
  <line x1="716" y1="368" x2="486" y2="368" stroke="#5eead4" stroke-width="2.4"
        marker-end="url(#arrow)" />
  <text x="601" y="392" font-family="IBM Plex Mono, monospace" font-size="11"
        fill="#5eead4" fill-opacity="0.9" text-anchor="middle">ssh -R 4713:localhost:4713</text>

  <text x="601" y="416" font-family="Inter, DejaVu Sans, sans-serif" font-size="11"
        letter-spacing="1.4" fill="#9fb8c8" text-anchor="middle">encrypted, one login, both directions</text>

  <!-- ======================= FOOTER NOTE ======================= -->
  <line x1="48" y1="648" x2="1152" y2="648" stroke="#ffffff" stroke-opacity="0.12" />
  <text x="48" y="680" font-family="Inter, DejaVu Sans, sans-serif" font-size="13"
        fill="#9fb8c8">Both listeners are bound to loopback: 127.0.0.1 on each side. Nothing new is reachable</text>
  <text x="48" y="702" font-family="Inter, DejaVu Sans, sans-serif" font-size="13"
        fill="#9fb8c8">from either network &#8212; the SSH connection is the only door, and it closes with the session.</text>
</svg>
