<!-- =============================================================================
     CONTACT FORM — pieza NEUTRA y AUTÓNOMA (copiar y pegar)
     -----------------------------------------------------------------------------
     · No usa el CSS, las fuentes ni las variables del sitio: trae su propio
       estilo mínimo, AISLADO bajo `.cform` (no filtra ni recibe estilos).
     · Sin dependencias (ni frameworks, ni Font Awesome, ni librerías).
     · Funciona en claro u oscuro del sistema (fuerza esquema claro para que
       los campos se vean siempre bien).
     · Requiere `contact.php` en el MISMO directorio que la página que lo usa.

     Uso: pega TODO este bloque donde quieras el formulario.
     Opciones (atributos del div raíz):
        data-endpoint="/contact.php"   ruta del endpoint, ABSOLUTA desde la raíz
                                       del dominio (por defecto: /contact.php).
                                       ⚠️ No usar ruta relativa: en páginas tipo
                                       /contacto/ resolvería a /contacto/contact.php
        data-title="..."              si se omite, no se muestra el título
        data-lead="..."               texto de apoyo bajo el título
        data-ok="..."                 mensaje de éxito
        data-button="..."             texto del botón
     ========================================================================== -->

<div class="cform" data-endpoint="/contact.php"
     data-title="Contact"
     data-lead="Write to us and we will get back to you."
     data-ok="Thank you. Your message has been received."
     data-button="Send message">

  <style>
    /* --- CSS base mínimo y neutro, aislado bajo .cform ------------------- */
    .cform {
      --cf-ink: #1f2937;
      --cf-muted: #6b7280;
      --cf-line: #d1d5db;
      --cf-bg: #ffffff;
      --cf-accent: #2563eb;
      --cf-err: #dc2626;
      --cf-ok: #059669;

      color-scheme: light;
      box-sizing: border-box;
      max-width: 36rem;
      margin: 0 auto;
      padding: 1.5rem;
      border: 1px solid var(--cf-line);
      border-radius: 10px;
      background: var(--cf-bg);
      color: var(--cf-ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      text-align: left;
    }
    .cform *, .cform *::before, .cform *::after { box-sizing: inherit; }
    .cform h2 { margin: 0 0 .35rem; font-size: 1.3rem; font-weight: 700; color: inherit; }
    .cform .cf-lead { margin: 0 0 1.25rem; color: var(--cf-muted); font-size: .95rem; }
    .cform .cf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .cform label { display: block; margin-bottom: 1rem; }
    .cform label > span { display: block; margin-bottom: .35rem; font-size: .85rem; font-weight: 600; color: inherit; }
    .cform input, .cform textarea {
      width: 100%; padding: .65rem .75rem;
      border: 1px solid var(--cf-line); border-radius: 6px;
      background: var(--cf-bg); color: var(--cf-ink);
      font: inherit; font-size: 1rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .cform textarea { min-height: 9rem; resize: vertical; }
    .cform input:focus, .cform textarea:focus {
      outline: 0; border-color: var(--cf-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .18);
    }
    .cform .cf-invalid { border-color: var(--cf-err) !important; }
    .cform button {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .7rem 1.4rem; border: 1px solid transparent; border-radius: 6px;
      background: var(--cf-accent); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .cform button:hover { opacity: .9; }
    .cform button[disabled] { opacity: .55; cursor: progress; }
    .cform .cf-status { margin: .9rem 0 0; font-size: .9rem; min-height: 1.2em; }
    .cform .cf-status.ok { color: var(--cf-ok); }
    .cform .cf-status.err { color: var(--cf-err); }
    /* Honeypot: presente para los bots, invisible para las personas */
    .cform .cf-hp {
      position: absolute !important; left: -9999px !important;
      width: 1px; height: 1px; overflow: hidden;
    }
    @media (max-width: 600px) {
      .cform .cf-row { grid-template-columns: 1fr; gap: 0; }
      .cform { padding: 1.15rem; }
    }
  </style>

  <h2 class="cf-title" hidden></h2>
  <p class="cf-lead" hidden></p>

  <form class="cf-form" novalidate>
    <div class="cf-row">
      <label>
        <span>Name</span>
        <input type="text" name="name" required minlength="2" maxlength="120" autocomplete="name">
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" required maxlength="160" autocomplete="email">
      </label>
    </div>

    <label>
      <span>Subject</span>
      <input type="text" name="subject" required minlength="3" maxlength="160">
    </label>

    <label>
      <span>Message</span>
      <textarea name="message" rows="6" required minlength="10" maxlength="5000"></textarea>
    </label>

    <!-- Honeypot -->
    <div class="cf-hp" aria-hidden="true">
      <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    </div>

    <input type="hidden" name="t" value="">
    <input type="hidden" name="s" value="">

    <button type="submit" class="cf-submit">Send</button>
    <p class="cf-status" role="status" aria-live="polite"></p>
  </form>

  <script>
  (function () {
    var root = document.currentScript.closest('.cform');
    if (!root) return;

    var form    = root.querySelector('.cf-form');
    var status  = root.querySelector('.cf-status');
    var submit  = root.querySelector('.cf-submit');
    var titleEl = root.querySelector('.cf-title');
    var leadEl  = root.querySelector('.cf-lead');

    // Opciones por atributos (todas opcionales)
    var endpoint = root.getAttribute('data-endpoint') || '/contact.php';
    var title    = root.getAttribute('data-title') || '';
    var lead     = root.getAttribute('data-lead') || '';
    var okMsg    = root.getAttribute('data-ok') || 'Thank you. Your message has been received.';
    var btnText  = root.getAttribute('data-button') || 'Send';

    if (title) { titleEl.textContent = title; titleEl.hidden = false; }
    if (lead)  { leadEl.textContent = lead;  leadEl.hidden = false; }
    submit.textContent = btnText;

    // El endpoint rechaza tokens con menos de 2 s de antigüedad (anti-bot).
    var TOKEN_MIN_MS = 2300;
    var tokenAt = 0;

    function setStatus(msg, kind) {
      status.textContent = msg || '';
      status.className = 'cf-status' + (kind ? ' ' + kind : '');
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function getToken() {
      return fetch(endpoint + '?token=1', { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok) throw new Error('token');
          form.t.value = d.t;
          form.s.value = d.s;
          tokenAt = Date.now();
        });
    }

    var ready = getToken();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (form.website.value !== '') return;              // bot

      submit.disabled = true;
      setStatus('Sending…');

      var wait = Math.max(0, TOKEN_MIN_MS - (Date.now() - tokenAt));

      ready.catch(getToken)
        .then(function () { return sleep(wait); })
        .then(function () {
          var data = {
            name: form.name.value,
            email: form.email.value,
            subject: form.subject.value,
            message: form.message.value,
            website: form.website.value,
            t: form.t.value,
            s: form.s.value
          };
          return fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(data)
          });
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (res.ok && res.d.ok) {
            form.reset();
            setStatus(okMsg, 'ok');
            ready = getToken();                          // token nuevo para el siguiente envío
          } else if (res.d && res.d.error === 'invalid') {
            setStatus('Please check the highlighted fields.', 'err');
            (res.d.fields || []).forEach(function (f) {
              var el = form.querySelector('[name="' + f + '"]');
              if (el) el.classList.add('cf-invalid');
            });
          } else if (res.d && res.d.error === 'bad_token') {
            setStatus('Session expired. Please press the button again.', 'err');
            ready = getToken();
          } else if (res.d && res.d.error === 'rate_limited') {
            setStatus('Too many messages from this connection. Try again later.', 'err');
          } else {
            setStatus('Could not send the message. Please try again.', 'err');
          }
        })
        .catch(function () { setStatus('Network error. Please try again.', 'err'); })
        .finally(function () { submit.disabled = false; });
    });

    form.addEventListener('input', function (e) {
      if (e.target.classList) e.target.classList.remove('cf-invalid');
    });
  })();
  </script>
</div>
